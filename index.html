<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sunil Maddirala, Realtor</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Open+Sans:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#111d2d; --red:#e0161e; --page:#f3f5f8; --card:#ffffff;
  --ink:#111d2d; --muted:#566173; --line:#dfe4ea; --band-ink:#ffffff;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --page:#0b131f; --card:#152235; --ink:#f2f5f9; --muted:#a4afbe; --line:#26364d; }
}
:root[data-theme="dark"]{ --page:#0b131f; --card:#152235; --ink:#f2f5f9; --muted:#a4afbe; --line:#26364d; }
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%}
body{margin:0;background:var(--page);color:var(--ink);
  font-family:"Open Sans",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.4}
main{max-width:30rem;margin:0 auto;min-height:100%;display:flex;flex-direction:column}

.band{position:relative;overflow:hidden;background:var(--navy);color:var(--band-ink);padding:2rem 1.5rem 1.75rem}
.band::before{content:"";position:absolute;top:-30%;right:-8rem;width:9rem;height:160%;
  background:var(--red);transform:rotate(24deg)}
.band::after{content:"";position:absolute;top:-30%;right:.2rem;width:.4rem;height:160%;
  background:#fff;opacity:.9;transform:rotate(24deg)}
.who{position:relative;z-index:1;display:flex;align-items:center;gap:1rem}
.who img{width:5.25rem;height:5.25rem;border-radius:50%;object-fit:cover;border:3px solid #fff;flex:none;background:#fff}
h1{margin:0;font-size:clamp(1.3rem,6.2vw,1.65rem);font-weight:800;letter-spacing:-.01em;line-height:1.15}
.role{margin:.2rem 0 0;font-size:.95rem;letter-spacing:.22em;opacity:.9}
.firm{position:relative;z-index:1;margin:1.25rem 0 0;font-family:"Cinzel",Georgia,"Times New Roman",serif;
  font-weight:600;font-size:.95rem;letter-spacing:.04em;max-width:70%}

.actions{list-style:none;margin:0;padding:1.25rem 1rem .5rem;display:grid;gap:.75rem}
.actions a{display:flex;align-items:center;gap:1rem;padding:1rem 1.1rem;min-height:4.5rem;
  background:var(--card);color:var(--ink);text-decoration:none;border:1px solid var(--line);
  border-left:.4rem solid var(--red);border-radius:.6rem}
.actions a:focus-visible{outline:3px solid var(--red);outline-offset:3px}
.actions a:active{transform:translateY(1px)}
.actions svg{width:1.9rem;height:1.9rem;flex:none;color:var(--red)}
.actions strong{display:block;font-size:1.12rem;font-weight:800}
.actions span{display:block;font-size:.95rem;color:var(--muted);overflow-wrap:anywhere}

footer{margin-top:auto;padding:1.25rem 1.5rem 1.75rem;font-size:.9rem;color:var(--muted)}
footer a{color:var(--ink);font-weight:600}
footer p{margin:0 0 .35rem}
</style>
</head>
